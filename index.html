<title>Linas Glitzer-Atelier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: a craft box. Thick ink outlines, sticker-like offset shadows, one big stage + a tool tray. */
:root{
  --bg:#dff3ef; --dots:#c3e6de; --ink:#2b2140; --card:#ffffff;
  --pink:#ff5d8f; --sun:#ffc93c; --teal:#2bb5a7; --lilac:#e9defc; --muted:#5f5677;
  --display:'Fredoka', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body:'Nunito', system-ui, sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--body);font-size:16px;
  background-color:var(--bg);background-image:radial-gradient(var(--dots) 2.5px,transparent 3px);background-size:28px 28px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.screen{height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{font:600 17px/1 var(--display);border:3px solid var(--ink);border-radius:16px;background:var(--card);
  padding:9px 14px;display:inline-flex;gap:7px;align-items:center;box-shadow:0 4px 0 var(--ink);cursor:pointer;min-height:46px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn svg{width:22px;height:22px;flex:none}
.btn.hot{background:var(--sun)}
.btn.pinkb{background:var(--pink);color:#fff}
button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}

/* home */
#home{overflow:auto}
.homeInner{margin:auto;width:min(980px,100%);padding-block:28px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
h1{font:700 clamp(44px,9vw,84px)/1 var(--display);margin:0;letter-spacing:.5px;text-wrap:balance}
h1 span{color:var(--pink);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--sun)}
.lead{font:600 22px var(--display);margin:0 0 10px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px;width:100%}
.card{border:4px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--ink);padding:18px 18px 22px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
.card:hover{transform:translateY(-4px) rotate(-1deg)}
.card:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ink)}
.card svg{width:150px;height:130px}
.card b{font:700 30px var(--display)}
.card span{font-size:16px;color:var(--ink);max-width:24ch}
.c1{background:var(--sun)} .c2{background:#ffb3cb} .c3{background:#9fe3d9}
.twinkle{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25;transform:scale(.7)}}

/* mode screens */
.bar{display:flex;align-items:center;gap:10px;padding-block:12px;flex-wrap:wrap}
.bar h2{flex:1;margin:0;font:700 28px var(--display);min-width:0}
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding-bottom:16px}
.stage{background:var(--card);border:3px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);
  min-height:0;min-width:0;padding:10px;display:flex;overflow:hidden}
.stage svg{width:100%;height:100%;touch-action:none;display:block}
.tools{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:14px;overflow:auto;
  display:flex;flex-direction:column;gap:16px;min-height:0}
.tools h3{margin:0 0 8px;font:600 18px var(--display)}
.hint{margin:0;color:var(--muted);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;padding:0;transition:transform .12s}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--card),0 0 0 7px var(--ink);transform:scale(1.08)}
.sw.magic{background:conic-gradient(#ff4d6d,#ff9f1c,#ffd60a,#80ed99,#4cc9f0,#9d4edd,#ff4d6d)}
.chip{font:600 16px var(--display);border:3px solid var(--ink);border-radius:14px;background:var(--card);padding:8px 12px;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--sun)}
.tabs .chip[aria-pressed="true"]{background:var(--pink);color:#fff}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{border:3px solid var(--ink);border-radius:14px;background:var(--card);padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 13px var(--display)}
.thumb svg{width:100%;aspect-ratio:1;max-width:100%}
.thumb[aria-pressed="true"]{background:var(--sun)}
.stk{width:54px;height:54px;border:3px solid var(--ink);border-radius:14px;background:var(--lilac);cursor:pointer;padding:4px}
.stk[aria-pressed="true"]{background:var(--sun)}
.stk svg{width:100%;height:100%}

/* coloring pictures */
.pic .r{fill:#fff;stroke:var(--ink);stroke-width:3;stroke-linejoin:round;vector-effect:non-scaling-stroke;cursor:pointer}
.pic .line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke}
.pic .d{fill:var(--ink)}
.pic .eye{fill:#fff;stroke:var(--ink);stroke-width:3;vector-effect:non-scaling-stroke}
.mini .r,.mini .line,.mini .eye{stroke-width:1}
.flash{animation:flash .35s ease-out}
@keyframes flash{0%{filter:brightness(1.6)}100%{filter:none}}

#mkStage{background:#fff0f5}
#drStage{background:linear-gradient(#fff6d9 0 78%,#ffd1e0 78% 100%)}
.walk{animation:walk .45s ease-in-out 6 alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes walk{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-10px) rotate(3deg)}}

.conf{position:fixed;top:-24px;width:12px;height:16px;border-radius:3px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(800deg)}}
.cheer{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:51;pointer-events:none;
  font:700 clamp(40px,9vw,80px) var(--display);color:var(--pink);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--sun);animation:cheer 1.8s ease-out forwards}
@keyframes cheer{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}

h1 .name{display:block;font-size:.42em;color:var(--teal);-webkit-text-stroke:0;text-shadow:none;transform:rotate(-3deg);margin-bottom:6px}
.c4{background:#cdbdfb}
.galWrap{flex:1;min-height:0;overflow:auto;padding-bottom:16px}
.galGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.gItem{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.gItem .pv{aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;display:flex;background:var(--lilac)}
.gItem .pv svg{width:100%;height:100%}
.gItem .pic .r,.gItem .pic .line,.gItem .pic .eye{stroke-width:1.5}
.gItem b{font:600 17px var(--display)}
.gItem .row .btn{flex:1;justify-content:center;font-size:15px;padding:8px}
.empty{margin:40px auto;max-width:36ch;text-align:center;font:600 20px/1.35 var(--display);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font:600 18px var(--display);padding:12px 20px;border-radius:16px;z-index:60;pointer-events:none;animation:toast 1.9s ease forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.task{background:var(--lilac);border:3px solid var(--ink);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.task .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.task h3{margin:0}
.task p{margin:0;font:600 19px/1.25 var(--display)}
.task .miss{font-weight:800;font-size:15px;color:#c9184a}
.stars{display:inline-flex;align-items:center;gap:4px;font:700 20px var(--display);font-variant-numeric:tabular-nums}
.stars svg{width:24px;height:24px}
.c5{background:#ffd4a8}
#naStage{background:linear-gradient(#fdeef4 0 82%,#f6d5e3 82% 100%)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stepb{border:3px solid var(--ink);border-radius:14px;background:var(--card);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 14px var(--display);cursor:pointer;min-width:0}
.stepb .num{width:28px;height:28px;border-radius:50%;background:var(--lilac);border:2px solid var(--ink);display:grid;place-items:center;font:700 15px var(--display);color:var(--ink)}
.stepb .num svg{width:16px;height:16px}
.stepb[aria-pressed="true"]{background:var(--pink);color:#fff}
.prog{display:flex;align-items:center;gap:10px;font-weight:800;font-variant-numeric:tabular-nums}
.bar2{flex:1;height:16px;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card)}
.bar2 i{display:block;height:100%;background:var(--teal);transition:width .3s}
.bottles{display:flex;flex-wrap:wrap;gap:6px}
.bottle{width:50px;height:70px;border:3px solid transparent;border-radius:14px;background:none;padding:2px;cursor:pointer}
.bottle[aria-pressed="true"]{border-color:var(--ink);background:var(--sun)}
.bottle svg{width:100%;height:100%}
.pt{transform-box:fill-box;transform-origin:center;pointer-events:none}
.bub{animation:rise .7s ease-out forwards}
.dust{animation:drop .7s ease-in forwards}
.spark{animation:spark .8s ease-out forwards}
@keyframes rise{to{transform:translate(var(--dx),-34px);opacity:0}}
@keyframes drop{to{transform:translate(var(--dx),40px);opacity:0}}
@keyframes spark{0%{transform:scale(.2)}50%{transform:scale(1.2)}100%{transform:scale(.4) translate(var(--dx),-20px);opacity:0}}
.wind{fill:none;stroke:#4cc9f0;stroke-width:5;stroke-linecap:round;opacity:0;animation:wind .7s linear 3}
@keyframes wind{0%{transform:translateX(-80px);opacity:0}30%{opacity:.9}100%{transform:translateX(340px);opacity:0}}
.card.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:18px;padding:12px 18px;text-align:left}
.card.wide svg{width:96px;height:84px}
.card.wide div{display:flex;flex-direction:column;gap:4px}
.bar h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){.bar h2{display:none}.bar{justify-content:space-between}}
@media (max-width:760px){
  .work{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .tools{max-height:42vh}
  .thumbs{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:86px;overflow-x:auto}
  .bar h2{font-size:22px}
  .btn .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){
  .walk,.twinkle,.flash,.card{animation:none;transition:none}
}
</style>

<section id="home" class="screen">
  <div class="homeInner">
    <h1><span class="name">Linas</span><span>Glitzer</span>-Atelier</h1>
    <p class="lead">Hallo Lina! Was möchtest du heute machen?</p>
    <div class="cards">
      <button class="card c1" data-go="color">
        <svg viewBox="0 0 150 130" aria-hidden="true">
          <g stroke="#2b2140" stroke-width="4" stroke-linejoin="round">
            <g transform="rotate(-30 75 65)"><rect x="25" y="52" width="90" height="26" rx="5" fill="#ff5d8f"/><path d="M115 52 L140 65 L115 78Z" fill="#ffe0c7"/><path d="M133 61 L140 65 L133 69Z" fill="#ff5d8f"/><rect x="45" y="52" width="10" height="26" fill="#fff"/></g>
            <g transform="rotate(-10 75 95)"><rect x="15" y="85" width="90" height="24" rx="5" fill="#4cc9f0"/><path d="M105 85 L128 97 L105 109Z" fill="#ffe0c7"/><path d="M121 93 L128 97 L121 101Z" fill="#4cc9f0"/></g>
          </g>
          <circle class="twinkle" cx="30" cy="25" r="7" fill="#fff" stroke="#2b2140" stroke-width="3"/>
        </svg>
        <b>Ausmalen</b><span>Tippe auf ein Feld und es wird bunt.</span>
      </button>
      <button class="card c2" data-go="makeup">
        <svg viewBox="0 0 150 130" aria-hidden="true">
          <g stroke="#2b2140" stroke-width="4" stroke-linejoin="round">
            <ellipse cx="75" cy="68" rx="44" ry="52" fill="#ffe0c7"/>
            <path d="M48 58 Q60 44 72 58 Q60 52 48 58Z M78 58 Q90 44 102 58 Q90 52 78 58Z" fill="#9d4edd"/>
            <circle cx="60" cy="62" r="5" fill="#2b2140"/><circle cx="90" cy="62" r="5" fill="#2b2140"/>

            <circle cx="52" cy="80" r="8" fill="#ff8fab" stroke="none" opacity=".7"/><circle cx="98" cy="80" r="8" fill="#ff8fab" stroke="none" opacity=".7"/>

          </g>
        </svg>
        <b>Schminken</b><span>Lippenstift, Rouge, Pinsel und Sticker.</span>
      </button>
      <button class="card c3" data-go="dress">
        <svg viewBox="0 0 150 130" aria-hidden="true">
          <g stroke="#2b2140" stroke-width="4" stroke-linejoin="round">
            <path d="M58 10 Q75 22 92 10 L100 22 L90 34 L94 56 L122 120 L28 120 L56 56 L60 34 L50 22Z" fill="#ff5d8f"/>
            <path d="M56 56 H94" stroke="#fff" stroke-width="6"/>
            <path d="M75 70 l4 8 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1Z" fill="#ffd60a" stroke-width="2"/>
          </g>
        </svg>
        <b>Anziehen</b><span>Stell ein Outfit zusammen und lauf über den Laufsteg.</span>
      </button>
      <button class="card c5" data-go="nails">
        <svg viewBox="0 0 150 130" aria-hidden="true">
          <g stroke="#2b2140" stroke-width="4" stroke-linejoin="round">
            <rect x="34" y="6" width="26" height="36" rx="5" fill="#2b2140"/>
            <rect x="16" y="40" width="62" height="80" rx="18" fill="#ff5d8f"/>
            <rect x="28" y="54" width="10" height="46" rx="5" fill="#fff" stroke="none" opacity=".6"/>
            <rect x="92" y="34" width="40" height="92" rx="20" fill="#ffe0c7"/>
            <path d="M100 74 V52 A12 12 0 0 1 124 52 V74 Q112 70 100 74Z" fill="#9d4edd"/>
            <polygon points="112,56 114,61 119,61 115,64 117,69 112,66 107,69 109,64 105,61 110,61" fill="#ffd60a" stroke-width="1.5"/>
          </g>
          <circle class="twinkle" cx="135" cy="18" r="6" fill="#fff" stroke="#2b2140" stroke-width="3"/>
        </svg>
        <b>Nagelstudio</b><span>Waschen, feilen, lackieren und verzieren.</span>
      </button>
      <button class="card c4 wide" data-go="gallery">
        <svg viewBox="0 0 150 130" aria-hidden="true">
          <g stroke="#2b2140" stroke-width="4" stroke-linejoin="round">
            <rect x="22" y="12" width="106" height="106" rx="10" fill="#ffc93c"/>
            <rect x="36" y="26" width="78" height="78" fill="#9fe3d9"/>

            <circle cx="96" cy="46" r="10" fill="#fff3b0"/>
            <path d="M118 30 C100 16 104 0 118 10 C132 0 136 16 118 30Z" fill="#ff5d8f" class="twinkle"/>

        </svg>
        <div><b>Linas Galerie</b><span>Alle deine Kunstwerke an einem Ort.</span></div>
      </button>
    </div>
  </div>
</section>

<section id="color" class="screen" hidden>
  <div class="bar">
    <button class="btn" data-go="home" aria-label="Zum Start"><svg viewBox="0 0 24 24"><path d="M3 11 L12 3 L21 11 V21 H14 V15 H10 V21 H3Z" fill="#ff5d8f" stroke="#2b2140" stroke-width="2" stroke-linejoin="round"/></svg><span class="lbl">Start</span></button>
    <h2>Ausmalen</h2>
    <button class="btn" data-undo aria-label="Rückgängig"><svg viewBox="0 0 24 24"><path d="M9 4 L3 10 L9 16 M3 10 H14 A6 6 0 0 1 14 22 H9" fill="none" stroke="#2b2140" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Ups</span></button>
    <button class="btn" data-reset aria-label="Neu anfangen"><svg viewBox="0 0 24 24"><path d="M6 3 H14 L19 8 V21 H6Z M14 3 V8 H19" fill="#fff" stroke="#2b2140" stroke-width="2" stroke-linejoin="round"/></svg><span class="lbl">Neu</span></button>
    <button class="btn hot" data-save aria-label="In der Galerie speichern"><svg viewBox="0 0 24 24"><path d="M12 20 C1 13 3 3 12 8 C21 3 23 13 12 20Z" fill="#ff5d8f" stroke="#2b2140" stroke-width="2" stroke-linejoin="round"/></svg><span class="lbl">Speichern</span></button>
    <button class="btn snd" aria-label="Ton an oder aus"></button>
  </div>
  <div class="work">
    <div class="stage"><svg id="colorSvg" class="pic" viewBox="0 0 400 400" aria-label="Ausmalbild"></svg></div>
    <aside class="tools" id="colorTools"></aside>
  </div>
</section>

<section id="makeup" class="screen" hidden>
  <div class="bar">
    <button class="btn" data-go="home" aria-label="Zum Start"><svg viewBox="0 0 24 24"><path d="M3 11 L12 3 L21 11 V21 H14 V15 H10 V21 H3Z" fill="#ff5d8f" stroke="#2b2140" stroke-width="2" stroke-linejoin="round"/></svg><span class="lbl">Start</span></button>
    <h2>Schminken</h2>
    <button class="btn" data-undo aria-label="Rückgängig"><svg viewBox="0 0 24 24"><path d="M9 4 L3 10 L9 16 M3 10 H14 A6 6 0 0 1 14 22 H9" fill="none" stroke="#2b2140" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Ups</span></button>
    <button class="btn" data-reset aria-label="Abschminken"><svg viewBox="0 0 24 24"><path d="M6 3 H14 L19 8 V21 H6Z M14 3 V8 H19" fill="#fff" stroke="#2b2140" stroke-width="2" stroke-linejoin="round"/></svg><span class="lbl">Abschminken</span></button>

          <circle cx="155" cy="229" r="5" fill="#2b2140" stroke="none"/><circle cx="245" cy="229" r="5" fill="#2b2140" stroke="none"/>
          <circle cx="159" cy="225" r="3" fill="#fff" stroke="none"/><circle cx="249" cy="225" r="3" fill="#fff" stroke="none"/>
          <path d="M128 222 Q155 205 182 222 M218 222 Q245 205 272 222" fill="none" stroke-width="4"/>
          <path d="M134 214 l-7 -8 M155 209 l0 -10 M176 214 l7 -8 M224 214 l-7 -8 M245 209 l0 -10 M266 214 l7 -8" fill="none" stroke-width="3"/>

    const t=ac.currentTime+when, o=ac.createOscillator(), g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.5,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}

colorTools.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.pic!==undefined){loadPic(+t.dataset.pic);pop();}
  else if(t.hasAttribute('data-magic')){col.magic=true;markColor();pop();}
  else if(t.dataset.c){col.color=t.dataset.c;col.magic=false;markColor();pop();}

function setDr(fn){const prev={...dr.s};fn(dr.s);dr.miss='';undo.dress.push(()=>{dr.s=prev;drawDoll();renderDr();});drawDoll();renderDr();pop();}
drTools.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const t=DR_TABS.find(x=>x.id===dr.tab);
  if(b.dataset.tab){dr.tab=b.dataset.tab;renderDr();pop();}
  else if(b.dataset.style)setDr(s=>s[t.id]=b.dataset.style);
  else if(b.dataset.c)setDr(s=>s[t.id==='skin'?'skinC':t.id+'C']=b.dataset.c);
  else if(b.hasAttribute('data-random'))setDr(s=>{DR_TABS.forEach(x=>{if(x.styles){s[x.id]=rnd(x.styles)[0];s[x.id+'C']=rnd(x.colors);}});s.hairC=rnd(HAIR);});
  else if(b.hasAttribute('data-check')){
    if(TASKS[dr.task].ok(dr.s)){stars++;store.set(SKEY,stars);dr.miss='';walk();celebrate('Aufgabe geschafft!');newTask();renderDr();}
    else{dr.miss=TASKS[dr.task].miss;tone(220,.25,'triangle',.1);renderDr();}
  }
  else if(b.hasAttribute('data-next')){newTask();dr.miss='';renderDr();pop();}
  else if(b.hasAttribute('data-walk')){walk();celebrate(rnd(['Superstar!','Toll siehst du aus!','Bravo!','Wow!']));}
});
drawDoll();renderDr();

/* ---------- NAGELSTUDIO ---------- */
const naSvg=$('#naSvg'), naTools=$('#naTools');
const FINGERS=[{x:140,y:335,len:150,w:46,r:-8},{x:193,y:328,len:172,w:48,r:-2},{x:246,y:332,len:160,w:47,r:4},{x:296,y:345,len:126,w:42,r:11},{x:122,y:448,len:105,w:52,r:-48}];
const L0=f=>Math.round((f.w-14)*1.15);
const POLISH=['#ff4d6d','#c9184a','#ff8fab','#ffc2d1','#ff9f1c','#ffd60a','#80ed99','#38b000','#4cc9f0','#4361ee','#9d4edd','#e0aaff','#ffffff','#2b2140','#d4af37','#c0c0d0'];
const DECOS=[['french','French-Spitze'],['punkte','Punkte'],['streifen','Streifen'],['herz','Herz'],['stern','Stern'],['blume','Blume'],['glitzer','Glitzer'],['regenbogen','Regenbogen'],['ring','Ring']];
const DECO_C=['#ffffff','#ffd60a','#ff4d6d','#ff8fab','#4cc9f0','#9d4edd','#38b000','#2b2140','#d4af37'];
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12 L10 17 L19 7" fill="none" stroke="#2b2140" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const NA_STEPS=[
 {id:'wash',label:'Waschen',hint:'Oh, Matsch vom Spielen! Rubbel mit dem Finger über die Nägel, bis sie sauber sind.',done:n=>n.dirtLeft<=0},
 {id:'file',label:'Feilen',hint:'Such dir eine Form aus. Dann reib mit dem Finger über jeden Nagel, bis er kurz und glatt ist.',done:(n,i)=>n.len<=L0(FINGERS[i])},
 {id:'base',label:'Unterlack',hint:'Tippe jeden Nagel an. Der Unterlack schützt den Nagel, und die Farbe hält besser.',done:n=>n.base},
 {id:'color',label:'Farbe',hint:'Such dir einen Nagellack aus und tippe auf einen Nagel. Jeder Nagel darf anders sein!',done:n=>!!n.color},
 {id:'deco',label:'Verzieren',hint:'Such dir eine Verzierung aus und tippe auf einen Nagel. Einen Ring tippst du auf den Finger.',done:n=>n.deco.length>0||!!n.ring},
 {id:'top',label:'Überlack',hint:'Tippe die Nägel an. Der Überlack macht sie glänzend. Zum Schluss trocknen lassen!',done:n=>n.gloss}];
const na={step:0,color:'#ff4d6d',deco:'herz',decoC:'#ffffff',ann:{}};
function newHand(){return {skin:'#f5c6a5',shape:'rund',dried:false,nails:FINGERS.map(f=>({len:L0(f)+20+Math.round(Math.random()*8),
  dirt:Array.from({length:3},()=>[+(Math.random()*.5-.25).toFixed(2),+(Math.random()*.55+.2).toFixed(2),3+Math.round(Math.random()*2)]),
  dirtLeft:1,base:false,color:null,deco:[],gloss:false,ring:null}))};}
let S=newHand();
function nailD(w,len,shape,filed){const h=w/2;
  if(!filed)return `M${-h} 0 V${-len+8} L${-h/2} ${-len} L0 ${-len+7} L${h/2} ${-len-3} L${h} ${-len+5} V0 Q0 -6 ${-h} 0Z`;
  if(shape==='eckig')return `M${-h} 0 V${-len+4} Q${-h} ${-len} ${-h+4} ${-len} H${h-4} Q${h} ${-len} ${h} ${-len+4} V0 Q0 -6 ${-h} 0Z`;
  if(shape==='mandel')return `M${-h} 0 V${-len*.5} Q${-h} ${-len} 0 ${-len-4} Q${h} ${-len} ${h} ${-len*.5} V0 Q0 -6 ${-h} 0Z`;
  return `M${-h} 0 V${-len+h} A${h} ${h} 0 0 1 ${h} ${-len+h} V0 Q0 -6 ${-h} 0Z`;}
function decoSvg(d,w,len){const h=w/2,cy=-len/2;
  switch(d.k){
   case 'french':return `<path d="M${-h-2} ${-len+15} Q0 ${-len+5} ${h+2} ${-len+15} V${-len-12} H${-h-2}Z" fill="${d.c}"/>`;
   case 'punkte':return [[-.22,.25],[.2,.45],[-.12,.65],[.22,.8]].map(([x,y])=>`<circle cx="${(x*w).toFixed(1)}" cy="${(-y*len).toFixed(1)}" r="3.2" fill="${d.c}"/>`).join('');
   case 'streifen':return `<path d="M${-h} ${-len*.3} L${h} ${-len*.55} M${-h} ${-len*.6} L${h} ${-len*.85}" stroke="${d.c}" stroke-width="4"/>`;
   case 'herz':return `<path transform="translate(0 ${cy}) scale(.5)" d="M0 12 C-28 -6 -15 -30 0 -14 C15 -30 28 -6 0 12Z" fill="${d.c}" stroke="#fff" stroke-width="2"/>`;
   case 'stern':return `<polygon points="${starPts(0,cy,10,4.5)}" fill="${d.c}" stroke="#fff" stroke-width="1.2"/>`;
   case 'blume':return [0,72,144,216,288].map(a=>`<circle cx="${(6*Math.sin(a*Math.PI/180)).toFixed(1)}" cy="${(cy-6*Math.cos(a*Math.PI/180)).toFixed(1)}" r="4.3" fill="${d.c}"/>`).join('')+`<circle cx="0" cy="${cy}" r="3.3" fill="#ffd60a"/>`;
   case 'glitzer':return d.s.map(([x,y,c])=>`<circle cx="${(x*w).toFixed(1)}" cy="${(-y*len).toFixed(1)}" r="1.9" fill="${c}"/>`).join('');
   case 'regenbogen':return ['#ff4d6d','#ff9f1c','#ffd60a','#80ed99','#4cc9f0','#9d4edd'].map((c,i)=>`<rect x="${-h}" y="${(-len-4+i*(len+4)/6).toFixed(1)}" width="${w}" height="${((len+4)/6+.6).toFixed(1)}" fill="${c}"/>`).join('');
  } return '';}
function fingerSvg(f,i){const n=S.nails[i],w=f.w,nw=w-14,L=L0(f),cy=-f.len+L+12,filed=n.len<=L,d=nailD(nw,n.len,S.shape,filed),ry=-f.len*.42;
  return `<g class="finger" data-i="${i}" transform="translate(${f.x} ${f.y}) rotate(${f.r})">
  <rect x="${-w/2}" y="${-f.len}" width="${w}" height="${f.len+45}" rx="${w/2}" fill="${S.skin}" stroke="${INK}" stroke-width="3"/>
  <path d="M${-w/2+9} ${ry+16} q${w/2-9} 6 ${w-18} 0" fill="none" stroke="${INK}" stroke-width="2" opacity=".3"/>
  ${n.ring?`<rect x="${-w/2-2}" y="${ry-6}" width="${w+4}" height="11" rx="5" fill="#ffd60a" stroke="${INK}" stroke-width="2.5"/><circle cx="0" cy="${ry-6}" r="7.5" fill="${n.ring}" stroke="${INK}" stroke-width="2.5"/><circle cx="-2.5" cy="${ry-8.5}" r="2" fill="#fff"/>`:''}
  <g class="nail" data-i="${i}" transform="translate(0 ${cy})">
   <clipPath id="nc${i}"><path d="${d}"/></clipPath>
   <path d="${d}" fill="#ffd9d0"/>
   ${n.dirtLeft>0?`<g opacity="${n.dirtLeft.toFixed(2)}">${n.dirt.map(([x,y,r])=>`<circle cx="${(x*nw).toFixed(1)}" cy="${(-y*L).toFixed(1)}" r="${r}" fill="#8d6e5a"/>`).join('')}</g>`:''}
   ${n.base?`<path d="${d}" fill="#ffffff" opacity=".6"/>`:''}
   ${n.color?`<path d="${d}" fill="${n.color}"/>`:''}
   <g clip-path="url(#nc${i})">${n.deco.map(x=>decoSvg(x,nw,n.len)).join('')}</g>
   ${n.gloss?`<path d="M${-nw/4} -8 V${(-n.len*.72).toFixed(1)}" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".75"/><circle cx="${nw/4}" cy="${(-n.len*.8).toFixed(1)}" r="2.5" fill="#fff" opacity=".9"/>`:''}
   <path d="${d}" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>
   <rect x="${-nw/2-6}" y="${-n.len-14}" width="${nw+12}" height="${n.len+20}" fill="transparent"/>
  </g></g>`;}
function renderHand(){
  let h=FINGERS.slice(0,4).map((f,i)=>fingerSvg(f,i)).join('');
  h+=`<path d="M86 520 V372 Q90 330 140 326 H292 Q322 328 318 372 V520Z" fill="${S.skin}" stroke="${INK}" stroke-width="3"/>`;
  h+=fingerSvg(FINGERS[4],4);
  h+=`<path d="M66 470 Q200 455 340 470 V510 H66Z" fill="#9fe3d9" stroke="${INK}" stroke-width="3"/><path d="M80 478 Q200 465 326 478" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>`;
  if(S.dried)h+=[[60,170,12],[340,190,10],[230,120,9],[30,330,8],[360,300,11]].map(([x,y,r])=>`<polygon class="twinkle" style="transform-box:fill-box;transform-origin:center" points="${starPts(x,y,r,r*.4)}" fill="#ffd60a" stroke="${INK}" stroke-width="2"/>`).join('');
  $('#handG').innerHTML=h;}
const bottleSvg=c=>`<rect x="14" y="2" width="12" height="20" rx="3" fill="#2b2140"/><rect x="6" y="20" width="28" height="36" rx="8" fill="${c}" stroke="#2b2140" stroke-width="3"/><rect x="11" y="26" width="5" height="18" rx="2.5" fill="#fff" opacity=".6"/>`;
const allDone=st=>S.nails.every((n,j)=>st.done(n,j));
function renderNaTools(){
  const st=NA_STEPS[na.step],cnt=S.nails.filter((n,i)=>st.done(n,i)).length;
  let h=`<div class="steps">${NA_STEPS.map((x,i)=>`<button class="stepb" data-step="${i}" aria-pressed="${i===na.step}"><span class="num">${allDone(x)?CHECK:i+1}</span>${x.label}</button>`).join('')}</div>
  <div><h3>Schritt ${na.step+1}: ${st.label}</h3><p class="hint">${st.hint}</p></div>
  <div class="prog"><div class="bar2"><i style="width:${cnt*20}%"></i></div><span>${cnt} von 5</span></div>`;
  if(st.id==='wash')h+=`<div><h3>Hautfarbe</h3><div class="swatches">${SKIN.map(c=>`<button class="sw" data-skin="${c}" style="background:${c}" aria-pressed="${c===S.skin}" aria-label="Hautfarbe"></button>`).join('')}</div></div>`;
  if(st.id==='file')h+=`<div><h3>Nagelform</h3><div class="row">${[['rund','Rund'],['eckig','Eckig'],['mandel','Mandel']].map(([k,l])=>`<button class="chip" data-shape="${k}" aria-pressed="${S.shape===k}">${l}</button>`).join('')}</div></div>`;
  if(st.id==='color')h+=`<div><h3>Nagellack</h3><div class="bottles">${POLISH.map(c=>`<button class="bottle" data-polish="${c}" aria-pressed="${c===na.color}" aria-label="Nagellack"><svg viewBox="0 0 40 60">${bottleSvg(c)}</svg></button>`).join('')}</div></div>`;
  if(st.id==='deco')h+=`<div><h3>Verzierung</h3><div class="row">${DECOS.map(([k,l])=>`<button class="chip" data-deco="${k}" aria-pressed="${na.deco===k}">${l}</button>`).join('')}</div></div>
   <div><h3>Farbe</h3><div class="swatches">${DECO_C.map(c=>`<button class="sw" data-dc="${c}" style="background:${c}" aria-pressed="${c===na.decoC}" aria-label="Farbe"></button>`).join('')}</div></div>`;
  if(['base','color','top'].includes(st.id))h+=`<div class="row"><button class="btn" data-all>Alle Nägel auf einmal</button></div>`;
  if(st.id==='top')h+=`<div class="row"><button class="btn pinkb" data-dry>Trocknen lassen</button></div>`;
  if(cnt===5&&na.step<5)h+=`<div class="row"><button class="btn hot" data-step="${na.step+1}">Weiter zu Schritt ${na.step+2}: ${NA_STEPS[na.step+1].label}</button></div>`;
  naTools.innerHTML=h;}
function snap(){const prev=JSON.stringify(S);undo.nails.push(()=>{S=JSON.parse(prev);renderHand();renderNaTools();});}
function checkStep(){const st=NA_STEPS[na.step];if(st.id!=='top'&&!na.ann[st.id]&&allDone(st)){na.ann[st.id]=1;toast(`Super! ${st.label} ist fertig.`);[660,880,1100].forEach((f,i)=>tone(f,.12,'triangle',.12,i*.1));}}
function fx(e,kind,n=1){const p=pt(naSvg,e),L=$('#fxL');
  for(let k=0;k<n;k++){let el;
    if(kind==='spark'){el=document.createElementNS(NS,'polygon');const x=p.x+(Math.random()*40-20),y=p.y+(Math.random()*40-20);el.setAttribute('points',starPts(x,y,6,2.5));el.setAttribute('fill',rnd(['#ffd60a','#ff8fab','#4cc9f0','#fff']));}
    else{el=document.createElementNS(NS,'circle');el.setAttribute('cx',p.x+(Math.random()*16-8));el.setAttribute('cy',p.y+(Math.random()*10-5));
      el.setAttribute('r',kind==='bub'?3+Math.random()*4:1.5+Math.random()*1.5);
      el.setAttribute('fill',kind==='bub'?'rgba(255,255,255,.7)':'#e8d5c4');if(kind==='bub'){el.setAttribute('stroke','#4cc9f0');el.setAttribute('stroke-width','1.5');}}
    el.setAttribute('class','pt '+kind);el.style.setProperty('--dx',(Math.random()*30-15)+'px');L.append(el);setTimeout(()=>el.remove(),850);}}
const hitAt=(e,sel)=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest?el.closest('#naSvg '+sel):null;};
let rub=null,lastScr=0;
function rubNail(i,amt,e){
  const n=S.nails[i],st=NA_STEPS[na.step].id,L=L0(FINGERS[i]);
  if(st==='wash'){if(n.dirtLeft<=0)return;if(!rub.snapped){snap();rub.snapped=true;}n.dirtLeft=Math.max(0,n.dirtLeft-amt/110);fx(e,'bub',2);if(n.dirtLeft===0){fx(e,'spark',6);tone(1200,.12,'triangle');}}
  if(st==='file'){if(n.len<=L)return;if(!rub.snapped){snap();rub.snapped=true;}n.len=Math.max(L,n.len-amt/6);fx(e,'dust',3);if(n.len<=L){fx(e,'spark',6);tone(1200,.12,'triangle');}}
  const now=performance.now();if(now-lastScr>70){lastScr=now;st==='wash'?tone(700+Math.random()*500,.05,'sine',.06):tone(110+Math.random()*60,.05,'sawtooth',.05);}
  renderHand();renderNaTools();checkStep();}
naSvg.addEventListener('pointerdown',e=>{
  const st=NA_STEPS[na.step].id,nl=hitAt(e,'.nail');
  if(st==='wash'||st==='file'){rub={x:e.clientX,y:e.clientY,snapped:false};if(nl)rubNail(+nl.dataset.i,18,e);return;}
  if(st==='deco'&&na.deco==='ring'){const f=hitAt(e,'.finger');if(!f)return;snap();const n=S.nails[+f.dataset.i];n.ring=n.ring===na.decoC?null:na.decoC;pop();renderHand();renderNaTools();checkStep();return;}
  if(!nl)return;const n=S.nails[+nl.dataset.i];snap();
  if(st==='base')n.base=true;
  if(st==='color')n.color=na.color;
  if(st==='deco'){if(n.deco.length>=6)n.deco.shift();n.deco.push({k:na.deco,c:na.decoC,s:na.deco==='glitzer'?Array.from({length:16},()=>[+(Math.random()*.9-.45).toFixed(2),+(Math.random()*.95+.05).toFixed(2),rnd(['#ffd60a','#ffffff','#ff8fab','#c0c0d0','#4cc9f0'])]):undefined});}
  if(st==='top')n.gloss=true;
  pop();fx(e,'spark',5);renderHand();renderNaTools();checkStep();
});
naSvg.addEventListener('pointermove',e=>{if(!rub)return;const dist=Math.hypot(e.clientX-rub.x,e.clientY-rub.y);if(dist<4)return;rub.x=e.clientX;rub.y=e.clientY;const nl=hitAt(e,'.nail');if(nl)rubNail(+nl.dataset.i,dist,e);});
['pointerup','pointercancel','pointerleave'].forEach(ev=>naSvg.addEventListener(ev,()=>rub=null));
naTools.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const st=NA_STEPS[na.step].id;
  if(b.dataset.step){na.step=+b.dataset.step;pop();}
  else if(b.dataset.skin){snap();S.skin=b.dataset.skin;renderHand();pop();}
  else if(b.dataset.shape){snap();S.shape=b.dataset.shape;renderHand();pop();}
  else if(b.dataset.polish){na.color=b.dataset.polish;pop();}
  else if(b.dataset.deco){na.deco=b.dataset.deco;pop();}
  else if(b.dataset.dc){na.decoC=b.dataset.dc;pop();}
  else if(b.hasAttribute('data-all')){snap();S.nails.forEach(n=>{if(st==='base')n.base=true;if(st==='color')n.color=na.color;if(st==='top')n.gloss=true;});renderHand();checkStep();pop();}
  else if(b.hasAttribute('data-dry')){
    if(!allDone(NA_STEPS[5])){toast('Erst alle Nägel mit Überlack anmalen!');tone(220,.2,'triangle',.1);return;}
    const L=$('#fxL');L.innerHTML=[170,230,290,350].map((y,i)=>`<path class="wind" style="animation-delay:${i*.12}s" d="M-40 ${y} q30 -12 60 0 t60 0"/>`).join('');
    toast('Pust, pust ...');for(let i=0;i<10;i++)tone(140+i*10,.12,'sine',.05,i*.12);
    setTimeout(()=>{L.innerHTML='';snap();S.dried=true;renderHand();celebrate('Wunderschöne Nägel!');},2200);
  }
  renderNaTools();
});
function resetNails(){snap();S=newHand();na.ann={};na.step=0;renderHand();renderNaTools();}
renderHand();renderNaTools();

/* ---------- Galerie ---------- */
const GKEY='lina-galerie';
const TRASH='<svg viewBox="0 0 24 24"><path d="M5 7 H19 L17.5 21 H6.5Z M3 7 H21 M9 7 V4 H15 V7" fill="#fff" stroke="#2b2140" stroke-width="2" stroke-linejoin="round"/></svg>';
const clean=it=>it.svg.replace(/ id="([^"]+)"/g,` id="$1-g${it.id}"`).replace(/url\(#([^)]+)\)/g,`url(#$1-g${it.id})`);
function saveArt(){
  const it={id:Date.now(),type:screen};
  if(screen==='color'){it.svg=colorSvg.outerHTML;it.name=PICS[col.pic].name;it.data={pic:col.pic,fills:[...colorSvg.querySelectorAll('.r')].map(r=>r.style.fill)};}
  else if(screen==='makeup'){it.svg=mkSvg.outerHTML;it.name='Schmink-Gesicht';it.data={tpl:mk.tpl};}
  else if(screen==='dress'){it.svg=drSvg.outerHTML;it.name='Outfit';it.data={s:{...dr.s}};}
  else if(screen==='nails'){$('#fxL').innerHTML='';it.svg=naSvg.outerHTML;it.name='Nägel';it.data={S:JSON.parse(JSON.stringify(S))};}
  else return;
  const list=store.get(GKEY,[]);list.unshift(it);if(list.length>40)list.length=40;
  if(store.set(GKEY,list)){toast('In der Galerie gespeichert!');tone(880,.12,'triangle');tone(1175,.16,'triangle',.12,.1);}
  else toast('Speichern klappt hier gerade nicht.');
}
function renderGallery(){
  const list=store.get(GKEY,[]);$('#galEmpty').hidden=list.length>0;
  $('#galGrid').innerHTML=list.map(it=>`<div class="gItem"><div class="pv">${clean(it)}</div><b>${it.name}</b>
    <div class="row"><button class="btn" data-open="${it.id}">Weitermachen</button><button class="btn" data-del="${it.id}" aria-label="Löschen">${TRASH}<span class="dl"></span></button></div></div>`).join('');
}
function openArt(it){
  if(it.type==='color'){loadPic(it.data.pic);const els=[...colorSvg.querySelectorAll('.r')];els.forEach((r,i)=>r.style.fill=it.data.fills[i]||'');col.done=els.every(r=>r.style.fill);}
  if(it.type==='makeup'){mkSvg.innerHTML=it.svg.replace(/^<svg[^>]*>/,'').replace(/<\/svg>\s*$/,'');mk.tpl=(it.data&&it.data.tpl)||'none';undo.makeup=[];renderMk();}
  if(it.type==='dress'){dr.s={...dr.s,...it.data.s};undo.dress=[];drawDoll();renderDr();}
  if(it.type==='nails'){S=it.data.S;na.ann={};undo.nails=[];renderHand();renderNaTools();}
  go(it.type);
}
function go(id){screen=id;document.querySelectorAll('.screen').forEach(s=>s.hidden=s.id!==id);if(id==='gallery')renderGallery();}

/* ---------- navigation & header buttons ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.go){go(b.dataset.go);pop();}
  else if(b.hasAttribute('data-save'))saveArt();
  else if(b.dataset.open){const it=store.get(GKEY,[]).find(x=>String(x.id)===b.dataset.open);if(it){openArt(it);pop();}}
  else if(b.dataset.del){
    if(!b.dataset.sure){b.dataset.sure='1';b.querySelector('.dl').textContent='Wirklich?';tone(300,.08);return;}
    store.set(GKEY,store.get(GKEY,[]).filter(x=>String(x.id)!==b.dataset.del));renderGallery();tone(260,.12,'triangle');}
  else if(b.hasAttribute('data-undo')){const f=undo[screen].pop();if(f){f();tone(380,.08,'sine',.12);}}
  else if(b.hasAttribute('data-reset')){if(screen==='color')resetColor();if(screen==='makeup')resetMk();if(screen==='nails')resetNails();tone(260,.15,'triangle',.12);}
  else if(b.classList.contains('snd')){muted=!muted;paintSnd();pop();}
});
</script>
